<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>

    <link rel="icon" href="./assets/favicon.png">
    <link rel="stylesheet" href="./style.css">
    <!-- script.js at end of body to make addEventListener work -->
</head>

<body>

    <header>
        <figure>
            <img src="./assets/Fotogram_Logo.svg" alt="Fotogram Logo">
            <figcaption>Logo der Website "Fotogram"</figcaption>
        </figure>
    </header>

    <main>
        <nav aria-labelledby="filterBtns">
            <ul aria-labelledby="filterBtns">
                <button onclick="renderFiltered('nature')" class="filterBtns"
                    aria-label="openThumbnailsNature">Wildnis</button>
                <button onclick="renderFiltered('japan')" class="filterBtns"
                    aria-label="openThumbnailsJapan">Japan</button>
            </ul>
        </nav>

        <section>
            <h1 id="title" tabindex="0"></h1>
            <ul id="thumbnails" aria-labelledby="title"></ul>
        </section>

        <dialog id="dialog" tabindex="-1" aria-labelledby="dialogFileTitle" aria-describedby="dialogDescription">
            <header>
                <span id="dialogFileTitle"></span>
                <button onclick="closeDialog()" aria-label="dialogClose"> <b>&#x58</b> </button>
            </header>

            <section>
                <h2 id="dialogDescription"></h2>
                <div id="dialogImage" aria-describedby="dialogDescription"></div>
            </section>

            <footer>
                <button onclick="backwardsDialog()" aria-label="dialogPreviousImage"> <b>&#x2190</b> </button>
                <span id="dialogCounter"></span>
                <button onclick="forwardsDialog()" aria-label="dialogNextImage"> <b>&#x2192</b> </button>
            </footer>
        </dialog>
    </main>

    <footer>
        <figure>
            <img src="./assets/Fotogram_Logo.svg" alt="Logo">
            <figcaption>Logo der Website "Fotogram"</figcaption>
        </figure>
        <p>© Christina Sautner</p>
    </footer>

    <!-- at end to make addEventListener work -->
    <script src="./script.js"></script>
</body>

</html>
